name: Bug report (macOS)
description: CTR-Online on Mac crashes, freezes, renders wrong or does not start
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. This is the **unofficial macOS port**: please do not report Mac problems to
        OCTR, SacredFire or the other upstream projects.

        **Never attach game files** (eboot.bin, sce_module, saves, dumps, keys or anything from the game
        folder); issues containing them are closed. Logs and screenshots are what helps.
  - type: input
    id: version
    attributes:
      label: App version
      description: Launcher → Settings → Version (or the menu CTR-Online on Mac → About).
      placeholder: v1.1.1-macos
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS
      placeholder: MacBook Pro M3 Max, 36 GB, macOS 26.1
    validations:
      required: true
  - type: dropdown
    id: game
    attributes:
      label: Game version
      options:
        - CUSA13795 (USA) 1.21
        - CUSA14876 (EU) 1.21
        - Another version ("Allow other game versions" on)
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Offline or online
      options:
        - Offline
        - Online (RyuNET)
  - type: textarea
    id: what
    attributes:
      label: What happened, and the steps to get there
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Launcher → Log → Export log, then attach the file. Hide your nickname if you prefer.
      render: text
